# NOT ACTIVE. This file is deliberately outside .github/workflows, so it can never run.
# To publish the site later (only with Hien's approval): enable GitHub Pages with "GitHub Actions" as the source,
# then copy this file to .github/workflows/pages.yml on the default branch. See docs in README.md, "Going live".
#
# It builds the site from the default branch, after pulling the newest data from the public profile hub
# (hienta16/hienta16), and deploys it to GitHub Pages.

name: Deploy site

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python scripts/sync_hub.py --remote --soft
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
